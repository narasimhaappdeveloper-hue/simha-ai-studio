
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMHA AI Studio</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b1020;color:#f5f7ff;
  font-family:Arial,sans-serif;height:100dvh;
  display:flex;justify-content:center;overflow:hidden
}
.app{
  width:100%;max-width:650px;height:100dvh;
  display:flex;flex-direction:column;
  background:#10172a
}
header{
  padding:16px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid #29334a;
  background:#111a30
}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#8057ff,#21b8cf);
  font-size:23px;font-weight:bold
}
.brand h2{margin:0;font-size:18px}
.brand small{color:#8d9bb5;font-size:11px}
.status{color:#53d6a0;font-size:11px;margin-top:4px}
.newchat{
  background:#202d48;border:1px solid #35435f;
  color:white;padding:10px 12px;border-radius:10px
}
.welcome{
  text-align:center;padding:32px 20px 15px
}
.welcome .biglogo{
  width:65px;height:65px;border-radius:22px;
  background:linear-gradient(135deg,#8057ff,#21b8cf);
  display:grid;place-items:center;margin:auto;
  font-size:32px;font-weight:bold
}
.welcome h1{font-size:24px;margin:18px 0 8px}
.welcome p{color:#9ba9c1;font-size:14px;line-height:1.6;margin:0}
.messages{
  flex:1;overflow-y:auto;padding:12px 15px 20px;
  display:flex;flex-direction:column;gap:14px
}
.message{
  max-width:88%;padding:13px 15px;border-radius:16px;
  font-size:14px;line-height:1.65;white-space:pre-wrap;
  overflow-wrap:anywhere
}
.user{
  align-self:flex-end;background:#6548d9;
  border-bottom-right-radius:5px
}
.ai{
  align-self:flex-start;background:#202d45;
  border:1px solid #30405e;border-bottom-left-radius:5px
}
.error{color:#ff9a9a}
.suggestions{
  display:flex;gap:8px;overflow-x:auto;padding:8px 14px;
  scrollbar-width:none
}
.suggestions button{
  white-space:nowrap;background:#1a2740;
  color:#cbd7ed;border:1px solid #34445f;
  border-radius:20px;padding:9px 12px;font-size:12px
}
.composer{
  padding:12px 13px calc(12px + env(safe-area-inset-bottom));
  background:#111a30;border-top:1px solid #29334a
}
.inputbox{
  display:flex;align-items:flex-end;gap:9px;
  background:#202d45;border:1px solid #3a4a67;
  border-radius:16px;padding:8px
}
textarea{
  flex:1;resize:none;outline:none;border:0;
  background:transparent;color:white;font:14px Arial;
  padding:9px;max-height:110px;min-height:24px
}
textarea::placeholder{color:#8998b2}
.send{
  width:42px;height:42px;border:0;border-radius:12px;
  background:#7655ef;color:white;font-size:20px
}
.send:disabled{opacity:.5}
.note{text-align:center;color:#71819d;font-size:10px;margin-top:9px}
.typing{color:#a8b6cf;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">S</div>
    <div>
      <h2>SIMHA AI Studio</h2>
      <div class="status">● AI Connected</div>
    </div>
  </div>
  <button class="newchat" id="newChat">＋ New Chat</button>
</header>

<section class="welcome" id="welcome">
  <div class="biglogo">S</div>
  <h1>Welcome to SIMHA AI</h1>
  <p>Your intelligent assistant.<br>Ask anything in Telugu or English.</p>
</section>

<main class="messages" id="messages"></main>

<div class="suggestions" id="suggestions">
  <button data-msg="Introduce yourself in Telugu">Introduce yourself</button>
  <button data-msg="Help me manage my small business">Business Assistant</button>
  <button data-msg="Help me create a website">Create a Website</button>
</div>

<footer class="composer">
  <div class="inputbox">
    <textarea id="prompt" rows="1" placeholder="Message SIMHA AI..."></textarea>
    <button class="send" id="send" aria-label="Send">➤</button>
  </div>
  <div class="note">SIMHA AI can make mistakes. Verify important information.</div>
</footer>
</div>

<script>

const API_URL = "https://simha-ai-web.narasimha-appdeveloper.workers.dev/api/chat";
const STORAGE_KEY = "simha_ai_chats_v1";

const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("send");
const welcome = document.getElementById("welcome");

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentChat = null;
let busy = false;

function saveChats() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function createChat() {
  currentChat = {
    id: Date.now().toString(),
    title: "New Chat",
    messages: [],
    updated: Date.now()
  };
  chats.unshift(currentChat);
  saveChats();
}

function saveMessage(role, text) {
  if (!currentChat) createChat();

  currentChat.messages.push({ role, text });
  currentChat.updated = Date.now();

  if (role === "user" && currentChat.title === "New Chat") {
    currentChat.title = text.slice(0, 35);
  }

  saveChats();
}

function addMessage(text, type) {
  welcome.style.display = "none";

  const el = document.createElement("div");
  el.className = "message " + type;
  el.textContent = text;

  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

function showChat(chat) {
  currentChat = chat;
  messages.innerHTML = "";
  welcome.style.display = chat.messages.length ? "none" : "block";

  chat.messages.forEach(item => {
    addMessage(item.text, item.role === "user" ? "user" : "ai");
  });
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || busy) return;

  if (!currentChat) createChat();

  addMessage(text, "user");
  saveMessage("user", text);

  promptBox.value = "";
  promptBox.style.height = "auto";
  busy = true;
  sendBtn.disabled = true;

  const loading = addMessage("SIMHA AI is thinking...", "ai typing");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    loading.classList.remove("typing");

    if (!response.ok || !data.success) {
      loading.textContent = "Error: " + (data.error || "AI request failed");
      loading.classList.add("error");
    } else {
      loading.textContent = data.reply || "No response received.";
      saveMessage("ai", loading.textContent);
    }
  } catch (error) {
    loading.classList.remove("typing");
    loading.textContent = "Connection failed. Please try again.";
    loading.classList.add("error");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    promptBox.focus();
    messages.scrollTop = messages.scrollHeight;
  }
}

// History button
const historyBtn = document.createElement("button");
historyBtn.textContent = "☰ History";
historyBtn.className = "newchat";
historyBtn.style.marginRight = "7px";
document.querySelector("header").insertBefore(
  historyBtn,
  document.getElementById("newChat")
);

// History panel
const historyPanel = document.createElement("div");
historyPanel.style.cssText = `
  position:fixed;inset:0;background:#080d1c;
  z-index:1000;padding:20px;display:none;
  overflow-y:auto;color:white;font-family:Arial
`;

historyPanel.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2>Chat History</h2>
    <button id="closeHistory" class="newchat">Close ✕</button>
  </div>
  <div id="historyList"></div>
`;

document.body.appendChild(historyPanel);

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  if (!chats.length) {
    list.textContent = "No previous chats yet.";
    return;
  }

  chats.forEach(chat => {
    const item = document.createElement("div");
    item.style.cssText = `
      display:flex;gap:8px;align-items:center;
      background:#202d45;padding:13px;margin:10px 0;
      border-radius:12px
    `;

    const open = document.createElement("button");
    open.textContent = chat.title;
    open.style.cssText = `
      flex:1;text-align:left;background:transparent;
      border:0;color:white;padding:8px;font-size:14px
    `;

    open.onclick = () => {
      showChat(chat);
      historyPanel.style.display = "none";
    };

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.style.cssText = `
      background:#713747;color:white;border:0;
      padding:9px;border-radius:8px
    `;

    del.onclick = () => {
      if (!confirm("Delete this chat?")) return;
      chats = chats.filter(c => c.id !== chat.id);
      if (currentChat && currentChat.id === chat.id) {
        currentChat = null;
        messages.innerHTML = "";
        welcome.style.display = "block";
      }
      saveChats();
      renderHistory();
    };

    item.append(open, del);
    list.appendChild(item);
  });
}

historyBtn.onclick = () => {
  renderHistory();
  historyPanel.style.display = "block";
};

document.getElementById("closeHistory").onclick = () => {
  historyPanel.style.display = "none";
};

// New Chat
document.getElementById("newChat").onclick = () => {
  currentChat = null;
  messages.innerHTML = "";
  welcome.style.display = "block";
  promptBox.value = "";
  promptBox.focus();
};

// Send message
sendBtn.onclick = () => sendMessage(promptBox.value);

promptBox.onkeydown = event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage(promptBox.value);
  }
};

promptBox.oninput = () => {
  promptBox.style.height = "auto";
  promptBox.style.height =
    Math.min(promptBox.scrollHeight, 110) + "px";
};

// Suggested messages
document.getElementById("suggestions").onclick = event => {
  const button = event.target.closest("button[data-msg]");
  if (button) sendMessage(button.dataset.msg);
};

// Restore latest chat when page opens
if (chats.length) {
  showChat(chats[0]);
}

</script>
</body>
</html>
